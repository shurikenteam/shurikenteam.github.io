<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shuriken Team</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    overflow-x:hidden;
}

body{
    font-family:Arial,sans-serif;
    overflow-x:hidden;
    background:#FD7AC0;
}

.bg-pattern{
    position:fixed;
    top:0;
    left:0;
    width:200%;
    height:100%;
    z-index:-4;
    background:
        repeating-linear-gradient(
            -45deg,
            #FDB3DD 0px,
            #FDB3DD 20px,
            #FD7AC0 20px,
            #FD7AC0 40px
        );
    animation:moveBackground 25s linear infinite;
}

.bg-glow{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:120vw;
    height:120vh;
    background:radial-gradient(circle,rgba(255,255,255,0.25) 0%,rgba(255,255,255,0) 60%);
    z-index:-3;
    pointer-events:none;
}

.top-gradient{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:25%;
    background:linear-gradient(to bottom,rgba(255,255,255,0.6),transparent);
    z-index:-2;
    pointer-events:none;
}

.bottom-gradient{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:25%;
    background:linear-gradient(to top,rgba(0,0,0,0.25),transparent);
    z-index:-2;
    pointer-events:none;
}

@keyframes moveBackground{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}

.content{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:40px 20px;
    box-sizing:border-box;
}

.logo-link{
    display:block;
    text-decoration:none;
    margin:0 auto;
}

.logo{
    width:300px;
    height:auto;
    display:block;
    margin:0 auto 12px auto;
    transition:transform .2s;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}

.logo-link:hover .logo{
    transform:scale(1.05);
}

.section-title{
    color:white;
    font-size:36px;
    text-align:center;
    margin-bottom:32px;
    text-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.projects{
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    gap:40px;
    align-items:center;
    justify-items:center;
    max-width:1000px;
    width:100%;
    margin:0 auto;
}

.projects-divider{
    width:1px;
    height:100%;
    background:rgba(255,255,255,0.4);
    min-height:400px;
}

.gamelogo{
    height:220px;
    width:auto;
    display:block;
    margin:0 auto 30px;
    transition:transform .2s;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}

a:hover .gamelogo{
    transform:scale(1.05);
}

.socials{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:20px;
    margin-bottom:20px;
}

.discord,
.youtube{
    display:inline-block;
}

.discord img,
.youtube img{
    width:60px;
    display:block;
    transition:transform .2s;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.3));
}

.discord:hover img,
.youtube:hover img{
    transform:scale(1.1);
}

@media (max-width:900px){

    .logo-link{
        width: 100%;
        display: flex;
        justify-content: center;
    }

    .logo{
        width:60%;
        margin-left: auto;
        margin-right: auto;
    }

    .projects{
        grid-template-columns:1fr;
    }

    .projects-divider{
        display:none;
    }

    .gamelogo{
        width:auto;
        height:160px;
    }

}
</style>

</head>
<body>

<div class="bg-pattern"></div>
<div class="bg-glow"></div>
<div class="top-gradient"></div>
<div class="bottom-gradient"></div>

<div class="content">

    <a class="logo-link" href="https://shurikenteam.github.io/team">
        <img class="logo" src="shuriken.png" alt="Shuriken Team">
    </a>

    <h1 class="section-title">Our Projects:</h1>

    <div class="projects">
        <div class="projects-column">
            <a href="https://shurikenteam.github.io/sakura">
                <img class="gamelogo" src="sakura.png" alt="Sakura DS">
            </a>
            <a href="https://shurikenteam.github.io/burning">
                <img class="gamelogo" src="burning.png" alt="Burning Ice">
            </a>
        </div>

        <div class="projects-divider"></div>

        <div class="projects-column">
            <a href="https://shurikenteam.github.io/dream">
                <img class="gamelogo" src="dream.png" alt="Dreamcore Memorial">
            </a>
            <a href="https://shurikenteam.github.io/minigp">
                <img class="gamelogo" src="minigp.png" alt="Mini GP">
            </a>
        </div>
    </div>

    <div class="socials">
        <a class="youtube" href="https://youtube.com/@shurikenteamofficial?si=OBhYDD_IboAj7G9A">
            <img src="youtube.png" alt="YouTube">
        </a>

        <a class="discord" href="https://discord.com/invite/RPwrYff5m4">
            <img src="discord.png" alt="Discord">
        </a>
    </div>

</div>

</body>
</html>
