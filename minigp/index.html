<!DOCTYPE html>
<html>
<head>
  <title>Mario Kart Mini GP</title>

  <script src="libpatch.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #4A4A4A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 80px 0;
      color: #333;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      z-index: -1;
      background: repeating-linear-gradient(
        -45deg,
        #737373 0px,
        #737373 20px,
        #4A4A4A 20px,
        #4A4A4A 40px
      );
      animation: moveBackground 20s linear infinite;
    }

    @keyframes moveBackground {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .game-box {
      width: 800px;
      background: white;
      border-radius: 30px;
      padding: 45px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      position: relative;
    }

    .game-logo {
      height: 170px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 20px;
      margin-bottom: 25px;
      color: #444;
    }

    .rom-note {
      color: #b00000;
      font-weight: bold;
      margin: 10px 0 20px;
    }

    .btn {
      display: inline-block;
      padding: 16px 30px;
      background: #4A4A4A;
      color: white;
      border-radius: 18px;
      font-size: 34px;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    .btn:hover {
      background: #737373;
    }

    input[type="file"] {
      margin-top: 10px;
    }

    .progress {
      height: 6px;
      background: #ddd;
      margin-top: 20px;
      border-radius: 5px;
      overflow: hidden;
    }

    #bar {
      height: 100%;
      width: 0%;
      background: #00c3ff;
      transition: width 0.2s;
    }

    .screenshots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 30px;
    }

    .screenshots img {
      width: 100%;
      border-radius: 12px;
    }

    @media (max-width: 900px) {
      .game-box { width: 95%; }
      .screenshots { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<div class="background"></div>

<div class="game-box">

  <img class="game-logo" src="logo.png">

  <h2>Mario Kart Mini GP</h2>

  <div class="desc">
    Patch your clean European Mario Kart DS ROM to play this mod.
  </div>

  <div class="rom-note">
    European ROM only!
  </div>

  <input type="file" id="rom" accept=".nds">

  <br><br>

  <button class="btn" id="patchBtn" disabled>Patch Now</button>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div class="screenshots">
    <img src="1.png">
    <img src="2.png">
    <img src="3.png">
    <img src="4.png">
  </div>

</div>

<script>
let romData = null;
let patchData = null;

const romInput = document.getElementById("rom");
const btn = document.getElementById("patchBtn");
const bar = document.getElementById("bar");

// Load patch automatically
fetch("game.xdelta")
  .then(r => r.arrayBuffer())
  .then(data => {
    patchData = data;
    updateState();
  })
  .catch(() => alert("Failed to load game.xdelta"));

romInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    romData = reader.result;
    updateState();
  };
  reader.readAsArrayBuffer(file);
});

function updateState() {
  btn.disabled = !(romData && patchData);
}

btn.onclick = () => {
  btn.disabled = true;

  applyPatchAsync(romData, patchData, {
    ignoreChecksums: false,

    onprogress: (p) => {
      bar.style.width = (p * 100) + "%";
    },

    onerror: (err) => {
      alert("Error: " + err);
      btn.disabled = false;
    },

    onpatchend: (out) => {
      bar.style.width = "0%";
      btn.disabled = false;

      const blob = new Blob([out], {type: "application/octet-stream"});
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "Mario Kart Mini GP.nds";
      a.click();

      URL.revokeObjectURL(url);
    }
  });
};
</script>

</body>
</html>
